<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F58220">
  <title>เข้าสู่ระบบ - เอกสารตรวจรับสินค้า</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <img src="/icons/logo.png" alt="COMPACT" onerror="this.style.display='none'">
      </div>
      <h1 class="login-title">เอกสารตรวจรับสินค้า</h1>
      <p class="login-subtitle">COMPACT INTERNATIONAL (1994) CO.,LTD.</p>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="username">ชื่อผู้ใช้</label>
          <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="login-error" style="display:none"></div>
        <button type="submit" class="btn-login" id="btnLogin">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
