<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F58220"/>
      <stop offset="100%" stop-color="#E06A10"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Clipboard body -->
  <rect x="46" y="40" width="100" height="124" rx="8" fill="url(#paper)" opacity="0.95"/>
  <!-- Clipboard clip -->
  <rect x="72" y="32" width="48" height="16" rx="4" fill="#fff" opacity="0.9"/>
  <rect x="82" y="28" width="28" height="12" rx="6" fill="#E06A10"/>
  <!-- Lines on paper -->
  <rect x="62" y="68" width="68" height="4" rx="2" fill="#F58220" opacity="0.3"/>
  <rect x="62" y="82" width="56" height="4" rx="2" fill="#F58220" opacity="0.3"/>
  <rect x="62" y="96" width="62" height="4" rx="2" fill="#F58220" opacity="0.3"/>
  <!-- Checkmark circle -->
  <circle cx="120" cy="132" r="24" fill="#2ECC71"/>
  <polyline points="108,132 116,140 133,122" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
