<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F58220"/>
      <stop offset="100%" stop-color="#E06A10"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Clipboard body -->
  <rect x="120" y="100" width="272" height="336" rx="20" fill="url(#paper)" filter="url(#shadow)" opacity="0.95"/>
  <!-- Clipboard clip top -->
  <rect x="190" y="80" width="132" height="44" rx="10" fill="#fff" opacity="0.9"/>
  <rect x="216" y="68" width="80" height="34" rx="17" fill="#E06A10"/>
  <!-- Lines on paper -->
  <rect x="160" y="176" width="192" height="10" rx="5" fill="#F58220" opacity="0.3"/>
  <rect x="160" y="212" width="156" height="10" rx="5" fill="#F58220" opacity="0.3"/>
  <rect x="160" y="248" width="172" height="10" rx="5" fill="#F58220" opacity="0.3"/>
  <rect x="160" y="284" width="140" height="10" rx="5" fill="#F58220" opacity="0.3"/>
  <!-- Checkmark circle -->
  <circle cx="320" cy="356" r="64" fill="#2ECC71"/>
  <circle cx="320" cy="356" r="56" fill="none" stroke="#fff" stroke-width="4" opacity="0.3"/>
  <polyline points="290,356 310,378 352,330" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
